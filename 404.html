<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Basic Korean</title>
    <style>
        body { font-family: -apple-system, "PingFang SC", "Noto Sans SC", sans-serif; background: #f6f6f5; color: #2b2b2b; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { text-align: center; padding: 48px; background: #fff; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,.08); }
        h1 { font-size: 64px; margin: 0; color: #c46a29; }
        p { color: #666; margin: 12px 0 24px; }
        a { display: inline-block; padding: 10px 28px; background: #c46a29; color: #fff; border-radius: 999px; text-decoration: none; font-weight: 600; }
        a:hover { background: #a8541d; }
    </style>
</head>
<body>
    <div class="box">
        <h1>404</h1>
        <p>页面不存在或已被移除</p>
        <a href="/">返回首页</a>
    </div>
</body>
</html>
