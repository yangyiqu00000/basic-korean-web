<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="manifest.json">
    <title>Basic Korean 🇰🇷 - 韩语最小可行系统</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Vue 3 (CDN, 零构建渐进式) -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body>
    <div id="app">
        <!-- 顶部导航 -->
        <header class="header">
            <div class="header-inner">
                <div class="logo" onclick="navigate('home')">
                    <span class="logo-icon">🇰🇷</span>
                    <span class="logo-text">Basic Korean</span>
                    <span class="logo-badge">V1.0</span>
                </div>
                <nav class="nav" id="mainNav">
                    <button class="nav-item active" data-page="home" onclick="navigate('home')" title="首页 (按 1)">🏠 归藏</button>
                    <button class="nav-item" data-page="skeleton" onclick="navigate('skeleton')" title="筑基 (按 2)">🏗️ 筑基</button>
                    <button class="nav-item" data-page="training" onclick="navigate('training')" title="抽丝训练 (按 3)">🃏 抽丝</button>
                    <button class="nav-item" data-page="stems" onclick="navigate('stems')" title="剥茧 (按 4)">📝 剥茧</button>
                    <button class="nav-item" data-page="ai" onclick="navigate('ai')" title="砥砺 (按 5)">🤖 砥砺</button>
                    <button class="nav-item" data-page="scene" onclick="navigate('scene')" title="临境 (按 6)">🎭 临境</button>
                    <button class="nav-item" data-page="schedule" onclick="navigate('schedule')" title="润物 (按 7)">🗓️ 润物</button>
                    <button class="nav-item" data-page="reference" onclick="navigate('reference')" title="拾遗 (按 8)">🏷️ 拾遗</button>
                </nav>
                <button class="mobile-menu-btn" onclick="toggleMobileMenu()">☰</button>
                <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="切换暗色/亮色主题">🌙</button>
                <button class="stats-toggle" onclick="openStats()" title="学习统计">📊</button>
            </div>
        </header>

        <!-- 主内容区域 -->
        <main class="main" id="mainContent">
            <!-- 由 JS 动态渲染 -->
            <div style="text-align:center;padding:60px 20px;">
                <div style="font-size:48px;margin-bottom:16px;">⏳</div>
                <p style="color:var(--text-light);">加载中...</p>
            </div>
        </main>

        <!-- 底部 -->
<footer class="footer">
	            <p>Basic Korean 启动包 V1.0 · 用最小系统启动一门新语言</p>
	        </footer>
	        <stats-panel ref="statsPanel"></stats-panel>
	    </div>

    <!-- 数据层 - 按顺序加载 -->
    <script src="js/data.js"></script>
    <script src="js/rules_data.js"></script>
    <script src="js/stems_data.js"></script>
    <script src="js/sentences_data.js"></script>
    <script src="js/reference_data.js"></script>
    <!-- 应用层 -->
    <script src="js/app.js"></script>
    <!-- Vue 3 渐进式迁移入口 -->
<script src="js/components/HomePage.js"></script>
		    <script src="js/components/StatsPanel.js"></script>
		    <script src="js/components/BkButton.js"></script>
		    <script src="js/components/BkCard.js"></script>
		    <script src="js/components/BkBadge.js"></script>
<script src="js/components/BkModal.js"></script>
		    <script src="js/components/TrainingCard.js"></script>
<script src="js/components/TrainingPage.js"></script>
<script src="js/components/ReferencePage.js"></script>
<script src="js/components/SchedulePage.js"></script>
<script src="js/components/SkeletonPage.js"></script>
<script src="js/components/StemsPage.js"></script>
						    <script src="js/vue-app.js"></script>

    <!-- Vue Templates -->
<script type="text/x-template" id="home-page-template">
      <div class="home-page">
        <div class="hero-section">
          <div class="hero-icon">🇰🇷</div>
          <h1 class="hero-title">Basic Korean</h1>
          <p class="hero-subtitle">用最小系统启动一门新语言</p>
          <bk-button variant="secondary" @click="openStats">📊 学习统计</bk-button>
        </div>
        <div class="home-modules">
          <bk-card v-for="mod in modules" :key="mod.page" @click="go(mod.page)">
            <div class="module-card-content">
              <span class="module-icon">{{ mod.icon }}</span>
              <span class="module-name">{{ mod.name }}</span>
              <span class="module-desc">{{ mod.desc }}</span>
            </div>
          </bk-card>
        </div>
        <div class="home-footer">
          <p>Basic Korean 启动包 {{ appVersion }} · 用最小系统启动一门新语言</p>
        </div>
      </div>
    </script>

	    <!-- StatsPanel Template -->
	    <script type="text/x-template" id="stats-panel-template">
	      <transition name="fade">
	        <div v-if="isVisible" class="stats-overlay" @click="onClickOverlay">
	          <div class="stats-panel">
	            <div class="stats-header">
	              <h3>📊 学习统计</h3>
	              <button class="stats-close" @click="close">✕</button>
	            </div>
	            <div class="stats-body">
	              <div class="stat-item">
	                <span class="stat-label">🗓️ 日课表进度</span>
	                <span class="stat-value">{{ scheduleDone }} / {{ scheduleTotal }}</span>
	              </div>
	              <div class="stat-item">
	                <span class="stat-label">🃏 断句已掌握</span>
	                <span class="stat-value">{{ trainingDoneCount }} / {{ trainingTotal }}</span>
	              </div>
	              <div class="stat-item">
	                <span class="stat-label">🤖 AI 练句历史</span>
	                <span class="stat-value">{{ aiHistoryCount }} 条</span>
	              </div>
	              <div class="stat-item">
	                <span class="stat-label">🎭 情景对话历史</span>
	                <span class="stat-value">{{ sceneHistoryCount }} 条</span>
	              </div>
	              <div class="stat-version">v{{ appVersion }} ({{ lastCommit }})</div>
	              <div class="stat-actions">
	                <button class="stat-btn" @click="exportAllData">📤 导出数据</button>
	                <button class="stat-btn" @click="importAllData">📥 导入数据</button>
	                <button class="stat-btn stat-btn-danger" @click="clearData('korean_progress', '日课表进度')">🗑️ 重置日课</button>
	                <button class="stat-btn stat-btn-danger" @click="clearData('korean_training_done', '断句掌握')">🗑️ 重置断句</button>
	              </div>
	            </div>
	          </div>
	        </div>
	      </transition>
</script>
		
		    <!-- Design System 组件模板 -->
		    <script type="text/x-template" id="bk-button-template">
		      <button :class="classes" :disabled="disabled" @click="$emit('click')"><slot /></button>
		    </script>
		    <script type="text/x-template" id="bk-card-template">
		      <div class="bk-card" :class="{ 'bk-card-hoverable': hoverable }" :style="'padding:var(--space-' + padding + ')'">
		        <slot />
		      </div>
		    </script>
		    <script type="text/x-template" id="bk-badge-template">
		      <span :class="classes"><slot /></span>
		    </script>
		    <script type="text/x-template" id="bk-modal-template">
		      <transition name="fade">
		        <div v-if="visible" class="bk-modal-overlay" @click="onClickOverlay">
		          <div class="bk-modal">
		            <div class="bk-modal-header">
		              <h3>{{ title }}</h3>
		              <button class="bk-modal-close" @click="close">✕</button>
		            </div>
		            <div class="bk-modal-body"><slot /></div>
		          </div>
		        </div>
		      </transition>
</script>

		    <!-- Training Card Template -->
		    <script type="text/x-template" id="training-card-template">
		      <div class="sentence-card" :class="{ mastered: done }">
		        <div class="sentence-group-badge">{{ sentence.group }}</div>
		        <div class="sentence-kr" @click="toggleReveal">
		          {{ sentence.kr }}
		          <button class="play-btn" @click.stop="speak" title="播放读音">🔊</button>
		        </div>
		        <transition name="slide-up">
		          <div v-if="isRevealed" class="sentence-details">
		            <div class="sentence-breakdown">
		              <span v-for="(b, i) in sentence.breakdown" :key="i" :class="getElemClass(b.tag)">
		                {{ b.part }}
		                <span class="elem-label">{{ b.meaning }}</span>
		              </span>
		            </div>
		            <div class="sentence-full">{{ sentence.full }}</div>
		          </div>
		        </transition>
		        <div class="sentence-actions">
		          <button class="check" :class="{ done: done }" @click="toggleDone">
		            {{ done ? '✅ 已掌握' : '○ 标记掌握' }}
		          </button>
		        </div>
		      </div>
		    </script>

		    <!-- Training Page Template -->
		    <script type="text/x-template" id="training-page-template">
		      <div class="training-page">
		        <div class="page-title">
		          <h2>🃏 抽丝训练</h2>
		          <p>点击韩文句子查看拆解，点击色块查看含义。已掌握在下，需练习在上。</p>
		        </div>
		        <div class="training-stats-bar">
		          <span>已掌握: {{ doneCount }} / {{ sentences.length }}</span>
		          <div class="progress-bar">
		            <div class="progress-fill" :style="'width:' + (doneCount / sentences.length * 100) + '%'"></div>
		          </div>
		        </div>
		        <div v-if="allDone" class="celebration-banner">
		          🎉 全部掌握！你太棒了！
		        </div>
		        <div class="training-grid">
		          <training-card
		            v-for="s in sortedSentences"
		            :key="s.id"
		            :sentence="s"
		            :done="trainingDone[s.id] || false"
		            :index="s.id"
		            @toggle-done="toggleDone"
		          ></training-card>
		        </div>
		      </div>
</script>

			    <!-- Reference Page Template -->
			    <script type="text/x-template" id="reference-page-template">
			      <div class="reference-page">
			        <div class="page-title">
			          <h2>🏷️ 拾遗</h2>
			          <p>助词、终结词尾、疑问词速查表</p>
			        </div>

			        <h3 class="ref-section-title">📌 助词</h3>
			        <div class="ref-table">
			          <div class="ref-row ref-header">
			            <span class="ref-col-tag">标记</span>
			            <span class="ref-col-type">类型</span>
			            <span class="ref-col-meaning">含义</span>
			            <span class="ref-col-level">等级</span>
			            <span class="ref-col-example">示例</span>
			          </div>
			          <div class="ref-row" v-for="p in ref.particles" :key="p.tag">
			            <span class="ref-col-tag">{{ p.tag }}</span>
			            <span class="ref-col-type">{{ p.type }}</span>
			            <span class="ref-col-meaning">{{ p.meaning }}</span>
			            <span class="ref-col-level">
			              <bk-badge :color="p.level === '核心' ? 'primary' : 'warning'">{{ p.level }}</bk-badge>
			            </span>
			            <span class="ref-col-example">{{ p.example }}</span>
			          </div>
			        </div>

			        <h3 class="ref-section-title">🔚 终结词尾</h3>
			        <div class="ref-table">
			          <div class="ref-row ref-header">
			            <span class="ref-col-tag">词尾</span>
			            <span class="ref-col-type">类型</span>
			            <span class="ref-col-meaning">含义</span>
			            <span class="ref-col-level">等级</span>
			            <span class="ref-col-example">示例</span>
			          </div>
			          <div class="ref-row" v-for="e in ref.endings" :key="e.tag">
			            <span class="ref-col-tag">{{ e.tag }}</span>
			            <span class="ref-col-type">{{ e.type }}</span>
			            <span class="ref-col-meaning">{{ e.meaning }}</span>
			            <span class="ref-col-level">
			              <bk-badge :color="e.level === '核心' ? 'primary' : e.level === '常用' ? 'warning' : 'success'">{{ e.level }}</bk-badge>
			            </span>
			            <span class="ref-col-example">{{ e.example }}</span>
			          </div>
			        </div>

			        <h3 class="ref-section-title">❓ 疑问词</h3>
			        <div class="ref-table">
			          <div class="ref-row ref-header">
			            <span class="ref-col-word">单词</span>
			            <span class="ref-col-meaning">含义</span>
			          </div>
			          <div class="ref-row" v-for="q in ref.questionWords" :key="q.word">
			            <span class="ref-col-word">{{ q.word }}</span>
			            <span class="ref-col-meaning">{{ q.meaning }}</span>
			          </div>
			        </div>
			      </div>
</script>

<!-- Schedule Page Template -->
				    <script type="text/x-template" id="schedule-page-template">
				      <div class="schedule-page">
				        <div class="page-title">
				          <h2>🗓️ 两周润物表</h2>
				          <p>每天 20 分钟，不多也不少。关键不是学了多少，而是每天都有。</p>
				        </div>
				        <div class="tip-banner">
				          <strong>⚡ 核心原则</strong><br>
				          ① 20 分钟到就停<br>
				          ② 不追求完美<br>
				          ③ 重复比新学重要<br>
				          ④ 所有句子至少读出声 1 遍
				        </div>
				        <div class="progress-overview">
				          <strong>📊 学习进度</strong> {{ doneCount }} / {{ totalCount }} ({{ percent }}%)
				          <div class="progress-bar">
				            <div class="progress-fill" :style="'width:' + percent + '%'"></div>
				          </div>
				        </div>
				        <div class="schedule-grid">
				          <div class="day-card" v-for="(day, di) in schedule" :key="day.day">
				            <div class="day-num">Day {{ day.day }}</div>
				            <div class="day-title">{{ day.title }}</div>
				            <div class="task" v-for="(task, ti) in day.tasks" :key="ti" @click="toggleCheck(di, ti)">
				              <span class="check" :class="{ done: isDone(di, ti) }"></span>
				              {{ task }}
				            </div>
				          </div>
				        </div>
				      </div>
				    </script>

				    <!-- Skeleton Page Template -->
				    <script type="text/x-template" id="skeleton-page-template">
				      <div class="skeleton-page">
				        <div class="page-title">
				          <h2>🏗️ 筑基</h2>
				          <p>7 大骨架规则 — 韩语句子的核心逻辑。理解它们，就能看懂 80% 的句子。</p>
				        </div>
				        <div class="skeleton-actions">
				          <bk-button variant="secondary" size="sm" @click="expandAll">📖 展开全部</bk-button>
				          <bk-button variant="secondary" size="sm" @click="collapseAll">📕 收起全部</bk-button>
				        </div>
				        <div class="rule-card" v-for="rule in rules" :key="rule.id">
				          <div class="rule-header" @click="toggleRule(rule.id)">
				            <span class="rule-icon">{{ rule.icon }}</span>
				            <span class="rule-title">{{ rule.title }}</span>
				            <span class="rule-toggle">{{ expanded[rule.id] ? '▲' : '▼' }}</span>
				          </div>
				          <transition name="slide-down">
				            <div v-if="expanded[rule.id]" class="rule-body">
				              <p class="rule-summary">{{ rule.summary }}</p>
				              <p class="rule-details" style="white-space:pre-line">{{ rule.details }}</p>
				              <div class="rule-examples">
				                <div class="rule-example" v-for="(ex, i) in rule.examples" :key="i">
				                  <div class="ex-kr" @click="speak(ex.kr)">
				                    {{ ex.kr }} <span class="play-btn-inline">🔊</span>
				                  </div>
				                  <div class="ex-breakdown">
				                    <span class="ex-part" v-for="(b, j) in ex.breakdown" :key="j">
				                      {{ b[0] }}<span class="ex-meaning">({{ b[1] }})</span>
				                    </span>
				                  </div>
				                </div>
				              </div>
				              <div class="rule-tip">💡 {{ rule.tip }}</div>
				            </div>
				          </transition>
				        </div>
				      </div>
</script>

    <!-- Stems Page Template -->
    <script type="text/x-template" id="stems-page-template">
      <div class="stems-page">
        <div class="page-title">
          <h2>📝 剥茧</h2>
          <p>84 个核心词干（动词/形容词）。词干 + 词尾 = 完整句子。</p>
        </div>
        <div class="stems-actions">
          <bk-button v-if="!isPlaying" variant="primary" size="sm" @click="playAll">▶️ 顺序播放全部</bk-button>
          <bk-button v-else variant="danger" size="sm" @click="stopPlay">⏹️ 停止播放</bk-button>
        </div>
        <div class="stems-grid">
          <div class="stem-card" v-for="s in allStems" :key="s.stem">
            <div class="stem-main" @click="speak(s.stem + '. ' + s.example)">
              <span class="stem" :class="getElemClass()">{{ s.stem }}</span>
              <span class="stem-proto">{{ s.proto }}</span>
              <span class="stem-irreg" v-if="s.irreg">⚠️ {{ s.irreg }}</span>
              <span class="stem-play-btn">🔊</span>
            </div>
            <div class="stem-details">
              <span class="stem-meaning">{{ s.meaning }}</span>
              <span class="stem-example" @click="speak(s.example)">{{ s.example }} 🔊</span>
            </div>
          </div>
        </div>
      </div>
    </script>
						</body>
</html>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>
