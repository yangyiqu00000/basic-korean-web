<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>Basic Korean 🇰🇷 - 韩语最小可行系统</title>
	    <link rel="stylesheet" href="css/style.css?v=20260728">
    <!-- 预加载关键资源 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="dns-prefetch" href="https://unpkg.com">
    <link rel="preload" href="css/style.css" as="style">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Vue 3 (CDN, 零构建渐进式) -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <!-- 清理 Service Worker 缓存，确保加载最新文件 -->
    <script>
    (async function() {
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (const reg of registrations) { await reg.unregister(); }
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          for (const key of keys) { await caches.delete(key); }
        }
      } catch(e) { console.warn('SW cleanup:', e); }
    })();
    </script>
</head>
<body>
    <div id="app">
        <!-- 顶部导航 -->
        <header class="header">
            <div class="header-inner">
                <div class="logo" onclick="navigate('home')">
                    <span class="logo-icon">🇰🇷</span>
                    <span class="logo-text">Basic Korean</span>
                    <span class="logo-badge">V1.0</span>
                </div>
                <nav class="nav" id="mainNav">
                    <button class="nav-item active" data-page="home" onclick="navigate('home')" title="首页 (按 1)">🏠 归藏</button>
                    <button class="nav-item" data-page="skeleton" onclick="navigate('skeleton')" title="筑基 (按 2)">🏗️ 筑基</button>
                    <button class="nav-item" data-page="training" onclick="navigate('training')" title="抽丝训练 (按 3)">🃏 抽丝</button>
                    <button class="nav-item" data-page="stems" onclick="navigate('stems')" title="剥茧 (按 4)">📝 剥茧</button>
                    <button class="nav-item" data-page="ai" onclick="navigate('ai')" title="砥砺 (按 5)">🤖 砥砺</button>
                    <button class="nav-item" data-page="scene" onclick="navigate('scene')" title="临境 (按 6)">🎭 临境</button>
                    <button class="nav-item" data-page="schedule" onclick="navigate('schedule')" title="润物 (按 7)">🗓️ 润物</button>
                    <button class="nav-item" data-page="reference" onclick="navigate('reference')" title="拾遗 (按 8)">🏷️ 拾遗</button>
                </nav>
                <button class="mobile-menu-btn" onclick="toggleMobileMenu()">☰</button>
                <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="切换暗色/亮色主题">🌙</button>
                <button class="stats-toggle" onclick="openStats()" title="学习统计">📊</button>
            </div>
        </header>

        <!-- 主内容区域 -->
        <main class="main" id="mainContent">
            <div id="vue-root"></div>
        </main>

        <!-- 底部 -->
<footer class="footer">
	            <p>Basic Korean 启动包 V1.0 · 用最小系统启动一门新语言</p>
	        </footer>
	        <stats-panel ref="statsPanel"></stats-panel>
	    </div>

    <!-- 数据层 - 按顺序加载 -->
    <script src="js/data.js"></script>
    <script src="js/rules_data.js"></script>
    <script src="js/stems_data.js"></script>
    <script src="js/sentences_data.js"></script>
    <script src="js/reference_data.js"></script>
	    <!-- 老的 Service Worker 注册已移除，避免缓存干扰开发 -->
		<script src="js/app.js?v=20260728"></script>
		<!-- Vue 页面组件（容器 + 委托原始渲染） -->
		<script src="js/components/HomePage.js?v=20260728"></script>
		<script src="js/components/SkeletonPage.js?v=20260728"></script>
		<script src="js/components/TrainingPage.js?v=20260728"></script>
		<script src="js/components/StemsPage.js?v=20260728"></script>
		<script src="js/components/AiPage.js?v=20260728"></script>
		<script src="js/components/ScenePage.js?v=20260728"></script>
		<script src="js/components/SchedulePage.js?v=20260728"></script>
		<script src="js/components/ReferencePage.js?v=20260728"></script>
		<!-- Vue 3：注册组件 + 接管路由 -->
		<script src="js/vue-app.js?v=20260728"></script>
	</body>

    
    <script>
	  // 性能标记
	  window.addEventListener('load', function() {
    // 标记首屏渲染完成时间
    var perf = performance.timing;
    if (perf) {
      var loadTime = perf.loadEventEnd - perf.navigationStart;
      console.log('Page load time: ' + loadTime + 'ms');
    }
  });
</script>
</body>
</html>
