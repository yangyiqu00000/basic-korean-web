<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>Basic Korean 🇰🇷 - 韩语最小可行系统</title>
	    <link rel="stylesheet" href="css/style.css?v=20260801d">
    <!-- 预加载关键资源 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="css/style.css?v=20260801d" as="style">
    <!-- 字体精简（P1-8）：去 300/500/800 冗余字重，仅保留正文所需 -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Vue 3 本地托管（P0-1）：不再依赖 unpkg CDN，提升大陆访问稳定性 -->
    <script src="js/vendor/vue.global.prod.js?v=20260801d"></script>
    <!-- Service Worker：版本化安全缓存（P2-2）——只缓存带 ?v= 的静态资源，HTML/API/TTS 永不缓存 -->
    <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js').catch(function(e) { console.warn('SW register:', e); });
      });
    }
    </script>
</head>
<body>
    <div id="app">
        <!-- 顶部导航 -->
        <header class="header">
            <div class="header-inner">
                <div class="logo" onclick="navigate('home')">
                    <span class="logo-icon">🇰🇷</span>
                    <span class="logo-text">Basic Korean</span>
                    <span class="logo-badge">V1.0</span>
                </div>
                <nav class="nav" id="mainNav" aria-label="主导航">
                    <button class="nav-item active" data-page="home" onclick="navigate('home')" title="首页 (按 1)" aria-current="page">🏠 归藏</button>
                    <button class="nav-item" data-page="skeleton" onclick="navigate('skeleton')" title="筑基 (按 2)">🏗️ 筑基</button>
                    <button class="nav-item" data-page="training" onclick="navigate('training')" title="抽丝训练 (按 3)">🃏 抽丝</button>
                    <button class="nav-item" data-page="stems" onclick="navigate('stems')" title="剥茧 (按 4)">📝 剥茧</button>
                    <button class="nav-item" data-page="ai" onclick="navigate('ai')" title="砥砺 (按 5)">🤖 砥砺</button>
                    <button class="nav-item" data-page="scene" onclick="navigate('scene')" title="临境 (按 6)">🎭 临境</button>
                    <button class="nav-item" data-page="schedule" onclick="navigate('schedule')" title="润物 (按 7)">🗓️ 润物</button>
                    <button class="nav-item" data-page="reference" onclick="navigate('reference')" title="拾遗 (按 8)">🏷️ 拾遗</button>
                    <button class="nav-item" data-page="wordlist" onclick="navigate('wordlist')" title="词句表 (按 9)">📚 词句表</button>
                </nav>
                <button class="mobile-menu-btn" onclick="toggleMobileMenu()" aria-label="展开菜单">☰</button>
                <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="切换暗色/亮色主题" aria-label="切换主题">🌙</button>
                <button class="stats-toggle" onclick="openStats()" title="学习统计" aria-label="学习统计">📊</button>
                <button class="auth-toggle" id="authBtn" onclick="openAuthModal()" title="登录 / 注册，云端同步学习数据" aria-label="登录或注册">👤 登录</button>
            </div>
        </header>

        <!-- 主内容区域 -->
        <main class="main" id="mainContent">
            <div id="vue-root"></div>
        </main>

        <!-- 底部 -->
        <footer class="footer">
            <p>Basic Korean 启动包 V1.0 · 用最小系统启动一门新语言</p>
        </footer>
    </div>

    <!-- 数据层（P1-7 合并：6 文件 → 2 文件，保持依赖顺序；重跑 scripts/rebuild-data.sh 重新生成） -->
    <script src="js/data_core.js?v=20260801d"></script>
    <script src="js/data_ext.js?v=20260801d"></script>
    <script src="js/app.js?v=20260801d"></script>
    <!-- Phase 2 云同步层（依赖 safeParse/escapeHtml 等全局函数，须在 app.js 之后） -->
    <script src="js/sync.js?v=20260801d"></script>
    <!-- Vue 页面组件（容器 + 委托原始渲染） -->
    <script src="js/components/HomePage.js?v=20260801d"></script>
    <script src="js/components/SkeletonPage.js?v=20260801d"></script>
    <script src="js/components/TrainingPage.js?v=20260801d"></script>
    <script src="js/components/StemsPage.js?v=20260801d"></script>
    <script src="js/components/AiPage.js?v=20260801d"></script>
    <script src="js/components/ScenePage.js?v=20260801d"></script>
    <script src="js/components/SchedulePage.js?v=20260801d"></script>
    <script src="js/components/ReferencePage.js?v=20260801d"></script>
    <script src="js/components/WordListPage.js?v=20260801d"></script>
    <!-- Vue 3：注册组件 + 接管路由 -->
    <script src="js/vue-app.js?v=20260801d"></script>
    <script>
      // 性能标记
      window.addEventListener('load', function() {
        // 标记首屏渲染完成时间
        var perf = performance.timing;
        if (perf) {
          var loadTime = perf.loadEventEnd - perf.navigationStart;
          console.log('Page load time: ' + loadTime + 'ms');
        }
      });
    </script>
</body>
</html>
